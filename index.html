<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CELLect</title>
    <style>
        :root{
            --bg:#eef3f1;
            --ink:#16302b;
            --mute:#58706a;
            --frame:#d9e5e1;
            --card:#fff;
            --line:#b7cbc5;
            --ok:#1b7a4b;
            --bad:#b3362b;
            --acc:#0f6b73;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top, 0px);
            padding-bottom:env(safe-area-inset-bottom, 0px);
        }
        html, body{
            background:var(--bg);
        }
        body{
            margin:0;
            color:var(--ink);
            font-family:Georgia, "Times New Roman", serif;
            display:flex;
            justify-content:center;
            padding:16px;
        }
        main{
            width:100%;
            max-width:680px;
        }
        h1{
            font-size:1.5rem;
            margin:0 0 4px;
        }
        p.sub{
            margin:0 0 12px;
            color:var(--mute);
            font-family:system-ui, sans-serif;
            font-size:0.92rem;
            line-height:1.4;
        }
        .bar{
            display:flex;
            justify-content:space-between;
            font-family:system-ui, sans-serif;
            font-size:0.95rem;
            margin-bottom:8px;
        }
        #frame{
            position:relative;
            width:100%;
            aspect-ratio:4/3;
            background:var(--frame);
            border:3px solid var(--line);
            border-radius:10px;
            overflow:hidden;
            touch-action:none;
            user-select:none;
        }
        .tile{
            position:absolute;
            transform:translate(-50%, -50%);
            line-height:1;
            pointer-events:none;
        }
        #frame>.tile{
            filter:blur(1.4px);
            opacity:0.75;
        }
        .tile img{
            width:1em;
            height:1em;
            object-fit:cover;
            display:block;
        }
        #glass{
            position:absolute;
            width:128px;
            height:128px;
            cursor:grab;
            touch-action:none;
            z-index:5;
        }
        #handle{
            position:absolute;
            left:calc(50% - 10px);
            top:50%;
            width:20px;
            height:112px;
            border-radius:10px;
            background:linear-gradient(90deg, #5b3d27, #8a603c, #5b3d27);
            transform-origin:10px 0;
            transform:rotate(-45deg);
            box-shadow:0 3px 8px rgba(0, 0, 0, 0.35);
        }
        #lens{
            position:absolute;
            inset:0;
            border-radius:50%;
            border:8px solid #b9953f;
            background:var(--bg);
            overflow:hidden;
            box-shadow:0 4px 14px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.35);
        }
        #lens:after{
            content:"";
            position:absolute;
            inset:0;
            border-radius:50%;
            background:radial-gradient(circle at 30% 28% rgba(255,255,255,0.35), transparent 40%);
            pointer-events:none;
        }
        #zoom{
            position:absolute;
            left:0;
            top:0;
            transform-origin:0 0;
            pointer-events:none;
        }
        #zoom.tile{
            opacity:1;
        }
        .ctl{
            display:flex;
            align-items:center;
            gap:10px;
            margin-top:10px;
            font-family:system-ui, sans-serif;
            font-size:0.92rem;
        }
        .ctl input{
            flex:1;
            accent-color:var(--acc);
            height:32px;
        }
        .ctl b{
            min-width:3.2em;
            text-align:right;
        }
        #hint{
            font-family:system-ui, sans-serif;
            font-size:0.88rem;
            color:var(--mute);
            margin:8px 0 0;
            min-height:1.3em;
        }
        #modal{
            position:fixed;
            inset:0;
            background:rgba(0, 0, 0, 0.55);
            display:none;
            align-items:center;
            justify-content:center;
            padding:16px;
            z-index:20;
            overflow:auto;
        }
        #modal.on{
            display:flex;
        }
        .card{
            position:relative;
            background:var(--card);
            border-radius:12px;
            padding:20px;
            width:100%;
            max-width:440px;
            text-align:center;
            font-family:system-ui, sans-serif;
            max-height:100%;
            overflow:auto;
        }
        .x{
            position:absolute;
            top:8px;
            right:8px;
            width:38px;
            height:38px;
            border:0;
            border-radius:50%;
            background:transparent;
            color:var(--ink);
            font-size:1.6rem;
            line-height:1;
            cursor:pointer;
        }
        .x:hover, .x:focus-visible{
            background:var(--line);
            outline:none;
        }
        .big{
            font-size:84px;
            line-height:1.1;
        }
        .big img{
            width:96px;
            height:96px;
            object-fit:cover;
            border-radius:8px;
        }
        .card h2{
            font-size:1.1rem;
            margin:8px 0 14px;
            font-family:Georgia, serif;
        }
        .choices{
            display:flex;
            gap:10px;
        }
        .choices button{
            flex:1;
            padding:14px 8px;
            font-size:1rem;
            border:2px solid var(--line);
            background:var(--bg);
            color:var(--ink);
            border-radius:8px;
            cursor:pointer;
        }
        .choices button:hover, .choices button:focus-visible{
            border-color:var(--acc);
            outline:none;
        }
        .choices button:disabled{
            cursor:default;
            opacity:0.55;
        }
        #fb{
            margin:14px 0 0;
            text-align:left;
            line-height:1.45;
            font-size:0.95rem;
        }
        #fb b.ok, .ok{
            color:var(--ok);
        }
        #fb b.bad, .bad{
            color:var(--bad);
        }
        .next{
            margin-top:12px;
            padding:10px 18px;
            border:0;
            border-radius:8px;
            background:var(--acc);
            color:var(--bg);
            font-size:1rem;
            cursor:pointer;
        }
        .row{
            display:flex;
            align-items:center;
            gap:10px;
            text-align:left;
            padding:8px 0;
            border-top:1px solid var(--line);
            font-size:0.92rem;
            line-height:1.35;
        }
        .row .em{
            font-size:30px;
            width:40px;
            text-align:center;
        }
        .row .em img{
            width:32px;
            height:32px;
            object-fit:cover;
            border-radius:5px;
        }
        .sc{
            font-size:2rem;
            margin:4px 0 8px;
            font-family:Georgia, serif;
        }
    </style>
    <body>
        <main>
            <h1>CELLect</h1>
            <p class="sub">Insert instruction here.</p>
            <div class="bar"><span id="found">Answered: 0 / 0</span><span id="score">Correct: 0 &nbsp; Wrong: 0</span></div>
            <div id="frame"><div id="glass" aria-label="Magnifying glass" role="button" tabindex="0"><div id="handle"></div><div id="lens"><div id="zoom"></div></div></div></div>
            <div class="ctl"><label for="zr">Magnification</label><input id="zr" type="range" min="2" max="7" step="0.1" value="4"><b id="zv"></b></div>
            <p id="hint"></p>
        </main>
        <div id="modal"><div class="card" id="qcard">
            <button class="x" id="x" aria-label="Close question">&times;</button>
            <div class="big" id="pic"></div>
            <h2 id="q"></h2>
            <div class="choices"><button id="bL"></button><button id="bR"></button></div>
            <div id="fb"></div>
            <button class="next" id="next" style="display:none;">Continue</button>
            </div> <div class="card" id="scard" style="display:none;"></div>
        </div>

        <script>
            
        </script>

    </body>
